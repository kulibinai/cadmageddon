[project]
name = "cadmageddon"
version = "1.0.0"
description = "CADMAGEDDON: high-fidelity CAD reconstruction from meshes with a locally served VLM agent."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["mesh2cad*"]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# Contributions read as prose; a long help string is not a defect.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The CLI hoists sys.path before importing the package it lives beside.
"scripts/*.py" = ["E402"]

# Grandfathered. These modules
# predate the lint config; the findings are stylistic (mutable-looking defaults
# that are frozen configs, zip() without an explicit strict=) and fixing them
# blind risks behaviour changes in the code every reconstruction runs through.
# New contributions under contrib/ get the full rule set. Clean these up one
# module at a time, with the bench run either side.
"mesh2cad/render.py" = ["B008", "B905"]
"mesh2cad/fit.py" = ["B905", "B007"]
"mesh2cad/section.py" = ["B905"]
"scripts/m2c.py" = ["E702", "E741", "B904"]
# Vendored from CADENA, kept as close to upstream as lint allows.
"metrics/gms.py" = ["UP007"]
"comparison.py" = ["B905"]
"isometric_views.py" = ["B905"]
